syntax = "proto3";

package seat.v1;

service SeatService {
    rpc GetSeat (GetSeatRequest) returns (GetSeatResponse);
    rpc ListSeatsByHall (ListSeatsRequest) returns (ListSeatsResponse);
    rpc UpdateSeat (UpdateSeatRequest) returns (UpdateSeatResponse);
    rpc DeleteSeat (DeleteSeatRequest) returns (DeleteSeatResponse);
}

message GetSeatRequest {
    string id = 1;
}

message GetSeatResponse {
    Seat seat = 1;
}

message ListSeatsRequest {
    string hall_id = 1;
    optional string screening_id = 2;
}

message ListSeatsResponse {
    repeated Seat seats = 1;
}

message UpdateSeatRequest {
    string id = 1;
    optional int32 price = 2;
    optional string type = 3;
}

message UpdateSeatResponse {
    Seat seat = 1;
}

message DeleteSeatRequest {
    string id = 1;
}

message DeleteSeatResponse {
    bool ok = 1;
}

message Seat {
    string id = 1;
    int32 row = 2;
    int32 number = 3;
    int32 price = 4;
    optional string status = 5;
    string type = 6;
    string hall_id = 8;
}